defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1

runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: franka_pickup_native_mixture
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 1000
  val_check_interval: 100
  save_interval: 1000

data:
  type: mixture
  train_data_paths: /path/to/prepared-pickup-mixture
  val_data_paths: /path/to/prepared-pickup-mixture
  num_workers: 2
  num_obs_steps: 1
  samples_per_epoch: 4096
  eval_max_samples: 128

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 4
  eval_batch_size: 1
  seed: 0
  model:
    precision: fp32
    model_path: /path/to/pi05-base
    num_action_chunks: 50
    action_dim: 32
    openpi:
      task: sft
      config_name: native_mixture
      action_horizon: 50
      model_action_dim: 32
      num_images_in_input: 3
      embed_dtype: bf16
      torch_compile: false
      discrete_state_input: true
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: constant
    lr_warmup_steps: 0
    total_training_steps: 1000
  fsdp_config:
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
