# Grounded-control loader/overfit pilot using one fixed midpoint per skill
# interval. Grounding success never affects frame selection or row retention.
defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    # MetricLogger writes TensorBoard directly under log_path, so isolate each
    # profile here instead of relying on experiment_name alone.
    log_path: /mnt/public/daibo/results/b1k_grounded_control_v01/training/pi05_grounded_oracle_pilot_p2
    project_name: rlinf
    experiment_name: "run"
    logger_backends: ["tensorboard"]
  max_epochs: 20
  max_steps: 500
  val_check_interval: -1
  save_interval: 100

data:
  train_data_paths: /mnt/public/daibo/datasets/behavior-1k/2025-challenge-demos
  behavior_dataset_root: /mnt/public/daibo/datasets/behavior-1k/2025-challenge-demos
  repo_id: "behavior-1k/2025-challenge-demos"
  modalities: ["rgb"]
  num_workers: 0
  fine_grained_level: 0
  tolerance_s: 1.0e-4
  tasks: []
  use_skill: false
  task_subtasks: {}
  grounded_sidecar_path: /mnt/public/daibo/results/b1k_grounded_control_v01/oracle_50ep_midpoint_unbiased_v1/data/part-00000.parquet
  grounded_token_mapping_path: /mnt/public/daibo/results/b1k_grounded_control_v01/oracle_50ep_midpoint_unbiased_v1/structural_token_mapping.json
  grounded_control_profile: p2_ground_sg

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  eval_batch_size: 1
  global_batch_size: 32
  seed: 42
  model:
    # Keep the Oracle ablations on one BEHAVIOR-adapted initialization.
    # The SFT path applies no freeze; is_lora=false therefore updates the full model.
    is_lora: false
    model_path: /mnt/public/daibo/models/pi05_b1kpt50_pt
    openpi:
      assets_dir: /mnt/public/daibo/models/pi05_b1kpt50_pt
      asset_id: "physical-intelligence/behavior"
      max_token_len: 512
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 500
    lr_warmup_steps: 50
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 0.0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false

critic:
  use_critic_model: false
