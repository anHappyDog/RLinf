# 200-step pipeline check for the cleaned three-task B1K 2025 training split.
# The sampler matches the macro task-success objective: tasks and episodes are
# uniform, while stage duration is softened with exponent 0.5.
defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: /mnt/public/daibo/results/b1k_grounded_control_v01/training/pi05_official_train480_p2_sqrt_stage_smoke200_v1
    project_name: rlinf
    experiment_name: "run"
    logger_backends: ["tensorboard"]
  max_epochs: 100
  max_steps: 200
  val_check_interval: -1
  save_interval: 200
  resume_dir: null

data:
  train_data_paths: /mnt/public/daibo/datasets/behavior-1k/2025-challenge-demos
  behavior_dataset_root: /mnt/public/daibo/datasets/behavior-1k/2025-challenge-demos
  repo_id: "behavior-1k/2025-challenge-demos"
  modalities: ["rgb"]
  # Four FSDP ranks x four workers uses 16 of the node's 56 CPU cores.
  num_workers: 4
  fine_grained_level: 0
  tolerance_s: 1.0e-4
  tasks: []
  use_skill: false
  task_subtasks: {}
  grounded_sidecar_path: /mnt/public/daibo/results/b1k_grounded_control_v01/oracle_2025_radio_lunchbox_microwave_train480_stride8_subgoal_v04_split_v1/data/part-00000.parquet
  grounded_token_mapping_path: /mnt/public/daibo/results/b1k_grounded_control_v01/oracle_2025_radio_lunchbox_microwave_train480_stride8_subgoal_v04_split_v1/structural_token_mapping.json
  grounded_control_profile: p2_ground_sg
  grounded_sampling:
    strategy: task_episode_stage
    stage_exponent: 0.5
    # 4,269 complete global batches of 64, just below the 273,228 source rows.
    samples_per_epoch: 273216

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  eval_batch_size: 1
  global_batch_size: 64
  seed: 42
  model:
    is_lora: false
    model_path: /mnt/public/daibo/models/pi05_b1kpt50_pt
    openpi:
      assets_dir: /mnt/public/daibo/models/pi05_b1kpt50_pt
      asset_id: "physical-intelligence/behavior"
      max_token_len: 512
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 200
    lr_warmup_steps: 20
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 0.0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false

critic:
  use_critic_model: false
