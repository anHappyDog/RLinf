defaults:
- model/pi0_5_rlinf@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: sft
  logger:
    log_path: ${oc.env:B1K_RLT_RESULT_DIR}
    project_name: rlinf
    experiment_name: behavior_rlt_stage1
    logger_backends:
    - tensorboard
  max_epochs: 100
  max_steps: 2000
  val_check_interval: -1
  save_interval: 250
  resume_dir: null
data:
  train_data_paths: /mnt/public/daibo/datasets/behavior-1k/2025-challenge-demos
  behavior_dataset_root: /mnt/public/daibo/datasets/behavior-1k/2025-challenge-demos
  repo_id: behavior-1k/2025-challenge-demos
  modalities:
  - rgb
  num_workers: 4
  fine_grained_level: 0
  tolerance_s: 0.0001
  tasks: []
  use_skill: false
  task_subtasks: {}
  grounded_sidecar_path: /mnt/public/daibo/results/b1k_grounded_control_v01/oracle_2025_radio_lunchbox_microwave_train480_stride8_subgoal_v04_split_v1/data/part-00000.parquet
  grounded_token_mapping_path: /mnt/public/daibo/results/b1k_grounded_control_v01/oracle_2025_radio_lunchbox_microwave_train480_stride8_subgoal_v04_split_v1/structural_token_mapping.json
  grounded_control_profile: p2_ground_sg
  grounded_sampling:
    strategy: task_episode_stage
    stage_exponent: 0.5
    samples_per_epoch: 273216
algorithm:
  adv_type: gae
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  eval_batch_size: 1
  global_batch_size: 32
  seed: 42
  model:
    is_lora: false
    model_path: /mnt/public/daibo/results/b1k_grounded_control_v01/rl/radio_pickup_canonical20_resume_rlstep10_gaelambda1_h1280_sde_dapo_groups20x20_traj400_mbs100_gbs16000_actionratio_kl001_fp32master_stateattention_p1_c5_crossdc20_steps15_v1/behavior_subpool_ppo_pi05/checkpoints/global_step_15/actor
    openpi:
      assets_dir: /mnt/public/daibo/models/pi05_b1kpt50_pt
      asset_id: physical-intelligence/behavior
      max_token_len: 512
      use_rlt: true
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1280
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: false
      rlt_use_mask: true
    require_complete_base: true
    num_steps: 10
    openpi_data:
      norm_stats_path: /mnt/public/daibo/results/b1k_grounded_control_v01/eval/p2_train480_step6000_comet_native_v1/model/assets/behavior-1k/2025-challenge-demos/norm_stats.json
  optim:
    lr: 1.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 2000
    lr_warmup_steps: 100
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 0.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
    wrap_policy:
      module_classes_to_wrap:
      - Block
      - Encoder1DBlock
      - RLTSelfAttentionLayer
reward:
  use_reward_model: false
critic:
  use_critic_model: false
