defaults:
  - model/openpi_official@actor.model
  - hybrid_engines/openpi_official_fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1

runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: franka_pickup_official_mixture
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 1000
  val_check_interval: 100
  save_interval: 1000

data:
  type: official_mixture
  train_data_paths:
    target: /path/to/prepared-native-pickup
    auxiliary: /path/to/prepared-molmo-pickup
  val_data_paths:
    target: /path/to/prepared-native-pickup
  num_workers: 2
  samples_per_epoch: 4096
  eval_max_samples: 128
  official:
    source_schemas: null
    cache_files: 4
    sampling: target_exposure
    target_schemas: [target/molmobot]
    target_samples_per_epoch: 512
    auxiliary_samples_per_epoch: 512

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 4
  eval_batch_size: 1
  seed: 0
  optim:
    lr: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: openpi_cosine
    lr_warmup_steps: 1000
    total_training_steps: 300000
    min_lr: 5.0e-5
