# New learning target; qualification records distinguish primary evidence from existing contracts.
sources:
- name: molmobot
  source_dataset: molmobot
  arms: 1
  weight: 1.0
  cameras:
    base_0_rgb: observation.images.exterior
    left_wrist_0_rgb: observation.images.wrist
  control_contract:
    representation: realized_joint_trajectory_v1
    joint_target: future measured joint7 radians; linear interpolation on source observation
      timestamps
    gripper_target: normalized closure 0 open / 1 closed; zero-order held source command
      when verified, otherwise masked
    state: current measured joint7 and verified measured gripper when available
    warning: new learning target; not original recorded joint commands
    arm_order: single
  training_group: realized_joint_trajectory_v1
  gripper_identity: Robotiq 2F85
  trajectory:
    gripper_target:
      feature: action
      index: 7
      open: 0
      closed: 255
      clip: true
      time_offset_s: 0.0
      evidence: publisher MolmoBot Robotiq command endpoints; row action already obs[i]
        paired commands[i+1]; no extra time shift
    gripper_state:
      feature: observation.state
      index: 7
      open: 0
      closed: 0.824033
      clip: true
      time_offset_s: 0.0
      evidence: official MolmoBot GripperStateTransform clips first driver/.824033
    gripper_missing_reason: null
    joint_qualification:
      value_policy: retain native measured q7 without numerical conversion
      configured_unit: radian
      evidence: 'primary: MuJoCo hinge qpos radians; fr3_joint1..7 publisher mapping'
  fixed_partition_splits:
    molmobot: train
    molmobot_val: val
