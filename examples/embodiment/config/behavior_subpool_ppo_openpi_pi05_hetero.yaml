defaults:
  - env/behavior_r1pro_subpool@env.train
  - env/behavior_r1pro@env.eval
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Production topology: run one four-trajectory outcome group on each RTX 4090
# node while keeping pi0.5 actor + rollout on the four training GPUs. The code,
# assets, and checkpoints must exist at the same paths on every node. Start Ray
# with ranks 0, 1, and 2 on the trainer, nxb_4090, and nxb_4090_2 respectively.
cluster:
  num_nodes: 3
  component_placement:
    actor:
      node_group: trainer
      placement: 0-3
    rollout:
      node_group: trainer
      placement: 0-3
    env:
      node_group: behavior
      placement: 0-7
  node_groups:
    - label: trainer
      node_ranks: 0
    - label: behavior
      node_ranks: 1-2
      env_configs:
        - node_ranks: 1-2
          python_interpreter_path: /mnt/public/daibo/venv/behavior_openpi/bin/python
          env_vars:
            - TMPDIR: /mnt/public/daibo/tmp
            - OMNIGIBSON_DATA_PATH: /mnt/public/daibo/datasets/omni_data
            - OMNIGIBSON_DATASET_PATH: /mnt/public/daibo/datasets/omni_data/behavior-1k-assets
            - OMNIGIBSON_KEY_PATH: /mnt/public/daibo/datasets/omni_data/omnigibson.key
            - OMNIGIBSON_ASSET_PATH: /mnt/public/daibo/datasets/omni_data/omnigibson-robot-assets
            - OMNIGIBSON_APPDATA_PATH: /mnt/public/daibo/tmp/b1k_subpool_ppo_appdata
            - OMNI_KIT_ACCEPT_EULA: "YES"
            - RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
            - RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES: "1"
            - HTTP_PROXY: http://10.10.20.100:1089
            - HTTPS_PROXY: http://10.10.20.100:1089
            - http_proxy: http://10.10.20.100:1089
            - https_proxy: http://10.10.20.100:1089

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:B1K_SUBPOOL_RESULT_DIR}
    project_name: rlinf
    experiment_name: behavior_subpool_ppo_pi05
    logger_backends: [tensorboard]
  only_eval: false
  use_training_pipeline: false
  max_epochs: 1000
  max_steps: 20
  val_check_interval: -1
  save_interval: 5
  seq_length: 4096
  max_prompt_length: 512
  resume_dir: null
  ckpt_path: null

algorithm:
  filter_rewards: false
  # DAPO-style on-policy sampling: all four rollout ranks in each group start
  # from the same snapshot, and every retained group contains success and failure.
  outcome_dynamic_sampling:
    enabled: true
    group_size: 4
    # Collect two independently quota-filtered groups, then concatenate their
    # eight fresh trajectories into one actor update.
    groups_per_update: 2
    # The two physical groups are rolled out concurrently on the two 4090 nodes.
    # A group that passes the quota is retained while only pending groups retry.
    parallel_groups: true
    min_successes: 1
    min_failures: 1
    # Zero preserves unbounded legacy behavior. Formal multi-state runs set a
    # positive bound and report the fixed snapshot as no-signal on exhaustion.
    max_attempts_per_group: 0
    # Quota filtering keeps sampling indefinitely; warn every four rejected groups.
    attempt_warning_interval: 4
    # Optional actor-only gate. No-signal groups still train the critic and do
    # not trigger resampling; only their PPO policy weight becomes zero.
    actor_signal_gate:
      enabled: false
      min_successes: 2
      min_failures: 2
  normalize_advantages: true
  advantage_std_floor: 0.1
  # Clip normalized advantages to bound the influence of state-level outliers.
  advantage_clip: null
  # Use logical_state for per-init-state centering/scaling in multi-state runs.
  advantage_normalization_scope: subtask
  group_size: 1
  reward_type: subtask_chunk_level
  # standard: bootstrap time-limit truncations; always: all done boundaries;
  # never: use only observed rewards at both terminal and timeout boundaries.
  bootstrap_type: standard
  logprob_type: chunk_level
  entropy_type: token_level
  adv_type: subtask_gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  kl_penalty_type: low_var_kl
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 8
  subpool:
    outcome_group_size: 4
    # The audited radio pickup suffixes are at most 989 primitive steps. A 1280
    # step cap leaves 29% slack, and its 40 action chunks keep the eight-stream
    # rollout divisible by GBS 64.
    max_episode_steps: 1280
    max_steps_per_rollout_epoch: 1280
    reward_coef: ${algorithm.reward_coef}
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
      # Boundary-only video has one frame per 32 actions: 60 / 32 ~= 1.875 Hz.
      fps: 2
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    skip_intermediate_obs_in_chunk: false
    num_env_subprocess: 1
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
      fps: 15

rollout:
  group_name: RolloutGroup
  backend: huggingface
  # Rank offsets are applied in the rollout worker. This makes the four policy
  # samples independent even though dynamic sampling shares their initial state.
  seed: 1234
  enable_offload: true
  pipeline_stage_num: 1
  # Finite dynamic batching removes the per-chunk all-env barrier while keeping
  # the complete rollout epoch on-policy. It requires
  # runner.enable_decoupled_mode=true and one rollout stage.
  dynamic_batching:
    enabled: false
    max_batch_size: 2
    max_wait_seconds: 0.1
  model:
    model_path: ${oc.env:B1K_SUBPOOL_MODEL_PATH}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # Keep PPO's reference distribution on the FSDP actor. The standalone
  # rollout copy has enough flow-SDE numerical drift to move ratio away from 1.
  recompute_prev_logprobs: true
  micro_batch_size: 1
  # One optimizer step consumes the complete 40-chunk x 8-stream rollout. This
  # preserves the accepted DAPO positive/negative mixture at optimizer-step
  # granularity and avoids within-rollout policy drift across minibatches.
  global_batch_size: 320
  # Optional value-only optimizer batch. This may be smaller than the policy
  # GBS when independent update epochs are enabled, yielding multiple critic
  # optimizer steps over one fixed rollout batch.
  critic_global_batch_size: null
  # Reuse detached OpenPI VLM prefix features across repeated critic epochs.
  # This requires model.openpi.detach_critic_input=true.
  cache_critic_inputs: false
  # Set both fields to integers to update the policy and critic independently
  # on the same accepted rollout batch. Null preserves legacy joint epochs.
  policy_update_epochs: null
  critic_update_epochs: null
  # Optional resume-only value reinitialization. The reset also discards Adam
  # moments for value_head parameters while preserving policy optimizer state.
  reset_value_head_on_resume: false
  # Reserve the first N global steps after resume for critic-only updates.
  # The optional epoch/value-clip overrides apply only inside those steps.
  resume_critic_warmup_global_steps: 0
  resume_critic_warmup_update_epochs: 5
  resume_critic_warmup_value_clip: null
  # Optional no-update diagnostic for exact per-initial-state PPO gradient
  # cosines. It requires one full-rollout global batch and disabled grad scaling.
  policy_gradient_diagnostics:
    enabled: false
    only: false
    max_states: 0
    output_dir: null
  seed: 1234
  enable_offload: true
  model:
    model_path: ${rollout.model.model_path}
    # The converted step-8000 checkpoint follows OpenPI's serving layout. Its
    # behavior normalization statistics live below assets/ rather than the
    # upstream pi05_behavior default (physical-intelligence/behavior).
    openpi_data:
      norm_stats_path: ${..model_path}/assets/behavior-1k/2025-challenge-demos/norm_stats.json
    add_value_head: true
    num_images_in_input: 3
    proprio_dim: 32
    action_dim: 23
    # Match the converted SFT checkpoint's action horizon and COMET's default
    # flow-sampling step count before adding PPO exploration noise.
    num_action_chunks: 32
    num_steps: 10
    openpi:
      task: rl
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
      joint_logprob: false
      ignore_last: true
      noise_level: 0.4
      noise_method: flow_sde
      train_expert_only: true
  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    clip_grad: 1.0
    policy_clip_grad: 5.0
    value_clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
    critic_only: false
  fsdp_config:
    strategy: fsdp
    sharding_strategy: shard_grad_op
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
