defaults:
  - env/behavior_r1pro_subpool@env.train
  - env/behavior_r1pro@env.eval
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    rollout: 0-1
    # Correctness mode requires one simulator per env rank and never splits one
    # simulator trajectory across multiple FSDP ranks.
    env: all
    actor: all

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:B1K_SUBPOOL_RESULT_DIR}
    project_name: rlinf
    experiment_name: behavior_subpool_ppo_pi05
    logger_backends: [tensorboard]
  only_eval: false
  use_training_pipeline: false
  max_epochs: 1000
  max_steps: 250
  val_check_interval: -1
  save_interval: 50
  seq_length: 4096
  max_prompt_length: 512
  resume_dir: null
  ckpt_path: null

algorithm:
  filter_rewards: false
  normalize_advantages: true
  advantage_std_floor: 0.1
  group_size: 1
  reward_type: subtask_chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  adv_type: subtask_gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    # With four env workers and one pipeline stage, this produces exactly one
    # simulator per worker and one independent trajectory per FSDP rank.
    total_num_envs: 4
    # The longest audited radio GT skill is 897 primitive steps. Keep one
    # synchronized horizon that can represent every skill in the joint batch.
    max_episode_steps: 1152
    max_steps_per_rollout_epoch: 1152
    reward_coef: ${algorithm.reward_coef}
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
      fps: 15
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    skip_intermediate_obs_in_chunk: false
    num_env_subprocess: 1
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
      fps: 15

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:B1K_SUBPOOL_MODEL_PATH}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 32
  seed: 1234
  enable_offload: true
  model:
    model_path: ${rollout.model.model_path}
    add_value_head: true
    num_images_in_input: 3
    proprio_dim: 32
    action_dim: 23
    # Short chunks reduce stale open-loop control and bound post-contact latency.
    num_action_chunks: 8
    num_steps: 8
    openpi:
      task: rl
      value_after_vlm: true
      value_vlm_mode: mean_token
      # The value head consumes the P2-conditioned VLM representation, so it is
      # V(s, z) even though there is one scalar head.
      detach_critic_input: true
      joint_logprob: false
      ignore_last: true
      noise_level: 0.4
      noise_method: flow_sde
      train_expert_only: true
  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 20
  fsdp_config:
    strategy: fsdp
    sharding_strategy: shard_grad_op
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
