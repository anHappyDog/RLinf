defaults:
  - behavior_r1pro
  - _self_

# Auto-reset packs complete episodes into the fixed rollout window. Primitive
# done flags still delimit GAE and DAPO compares only each stream's first episode.
auto_reset: true
ignore_terminations: false
# Physics/reward/done still run at 60 Hz; render and policy observation once per
# action chunk (or immediately at an earlier terminal transition).
skip_intermediate_obs_in_chunk: true
num_env_subprocess: 1
enable_offload: false
enable_init_offload: false
# Preserve the official evaluator's Kit renderer defaults. In particular, do
# not apply RLinf's 10% texture-streaming memory budget.
renderer_mode: official

# Save a diagnostic policy-rate composite instead of triggering a fourth
# simulator render. The encoder runs behind rollout with one-video backpressure.
video_cfg:
  include_wrist_views: true
  async_save: true
  max_pending_videos: 1

subpool:
  enabled: true
  # Official B1K evaluation creates the scene from seed template 0, then loads
  # the selected challenge instance's TRO state. Canonical snapshots are dumped
  # after that mutation; do not replace this with the episode instance id.
  bootstrap_instance_id: 0
  manifest_path: ${oc.env:B1K_SUBPOOL_MANIFEST}
  token_mapping_path: ${oc.env:B1K_GROUNDED_TOKEN_MAPPING}
  asset_fingerprint: ${oc.env:B1K_ASSET_FINGERPRINT}
  fixed_subtask_id: null
  # Set this to the dynamic-sampling group size so every group starts from the
  # same snapshot while independent rollout ranks sample different actions.
  outcome_group_size: 1
  # Formal multi-state DAPO overrides these together. One shuffled permutation
  # covers each canonical snapshot once per update; retries and auto-resets keep
  # the same logical group's snapshot.
  outcome_snapshot_schedule: random
  sticky_outcome_snapshot: false
  # Evaluation can assign one catalog snapshot to each environment rank and
  # keep it across rollout epochs, enabling exact per-state baseline counts.
  fixed_snapshot_per_env: false
  # Rank-offset round robin makes every group of skill_count env workers cover
  # every skill exactly once, independent of pool size and success rate.
  subtask_sampling: round_robin
  pool_weights:
    canonical: 1.0
    predecessor_success: 0.0
    recovery: 0.0
  dynamic_updates: false
  # Cache validated CPU simulator states inside each env worker. Set this to the
  # canonical pool size to avoid repeated shared-filesystem reads during reset.
  # Cached states are still restored through the normal OmniGibson path.
  state_cache_size: 0
  # Optional runtime-only reward changes for controlled A/B experiments. The
  # source manifest and state hashes remain unchanged.
  reward_overrides: {}
  # Subpool success/timeout can replace the much broader official whole-task
  # BDDL termination check when the patched OmniGibson API is available.
  skip_official_task_termination: false
  max_dynamic_per_subtask_pool: 32
  # Optionally retain every timeout's exact serialized=False simulator state
  # for later DAgger or recovery-data collection. Each simulator writes locally;
  # cross-datacenter collector directories must be rsynced back after the run.
  failure_state_capture:
    enabled: false
    output_dir: null
    run_id: null
    # Standalone evaluation does not receive the runner's training step RPC.
    # Set this explicitly when collecting from one fixed checkpoint.
    policy_global_step: null
    # A pickup target becomes a recovery candidate only after it has tilted
    # relative to its reset pose and remained nearly stationary for this many
    # consecutive primitive simulator steps.
    tipped_angle_deg: 45.0
    stable_steps: 8
    max_linear_speed: 0.05
    max_angular_speed: 0.2
  state_capture_interval: 8
  state_ring_size: 32
  # Boundary-only observation capture explicitly refreshes visual object states
  # and renders twice before reading the three policy cameras.
  boundary_render_iterations: 2
  # Recovery starts are sampled from this temporal lag window; the direct
  # timeout state is never inserted.
  recovery_min_lag_states: 2
  recovery_max_lag_states: 16

omni_config:
  task:
    # The subpool tracker owns reward magnitudes, but it needs the official
    # sequential task reward for direct per-stage predicates and diagnostics.
    reward_config:
      reward_mode: task
      task_specific_reward_name: null
      task_specific_reward_kwargs: {}
