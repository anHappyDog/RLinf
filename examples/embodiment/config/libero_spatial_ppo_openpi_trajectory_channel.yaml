defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/pi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout,trajectory_storage: 0-3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_ppo_openpi_trajectory_channel"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 1
  max_steps: 1

  only_eval: False
  val_check_interval: -1
  save_interval: 40

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0


  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean" 
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: "EnvGroup"

  # Override the default values in env/libero_spatial
  train:
    rollout_epoch: 1
    total_num_envs: 32
    max_episode_steps: 240 # max episode steps for truncation
    max_steps_per_rollout_epoch: 240
  eval:
    rollout_epoch: 1
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/mnt/public/daibo/models/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 1536
  seed: 42
  enable_offload: False

  # Override the default values in model/pi0
  model:
    model_path: "/mnt/public/daibo/models/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    num_action_chunks: 5 # interface for the env
    add_value_head: True
    # openpi specific parameters
    openpi:
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

trajectory:
  enabled: true
  channel_group_name: "TrajectoryChannelGroup"
  storage_group_name: "TrajectoryStorageGroup"
  live_queue_size: 8
  ingest_queue_size: 8
  max_inflight_frames: 8
  max_resident_bytes: 4294967296
  backpressure_timeout_s: 30.0
  reservation_timeout_s: 30.0
  drain_timeout_s: 30.0
  live:
    direct_policy_input: true
    image_shape: [256, 256, 3]
    state_shape: [8]
    extra_view_shape: null
    max_description_bytes: 256
    # Same-host paired A/B remains faster raw; enable for a placement only
    # after its live-path benchmark shows a net latency gain.
    compress_images: false
    compression_level: 1
    pin_memory: true
  compression:
    # Four lanes are the measured candidate for this placement. Compression
    # remains opt-in until the production camera distribution is accepted.
    enabled: false
    codec: lz4
    level: 1
    min_bytes: 65536
    block_bytes: 1048576
    num_threads: 4
